[workspace]
name = "yggdrasil-rapidjson"
version = "1.1.0.7"
description = "Version of rapidjson with extended support for yggdrasil"
authors = ["Meagan Lang <langmm.astro@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
preview = ["pixi-build"]
build-variants-files = [
  "./conda.recipe/conda_build_config.yaml",
]

[dependencies]
python = "*"
numpy = "*"

[feature.build.dependencies]
cmake = ">=3.18"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"
pkg-config = "*"
# Required by create_metaschema.py
requests = "*"
pyyaml = "*"
libpython = "*"
# Required for tests
gtest = "*"

[feature.build-conda.dependencies]
rattler-build = "*"

[feature.docs.dependencies]
doxygen = "*"

[environments]
build = { features = ["build"], solve-group = "default" }
build-conda = { features = ["build-conda"], solve-group = "default" }
test = { features = ["build"], solve-group = "default" }
docs = { features = ["build", "docs"], solve-group = "default" }
default = { features = ["build"], solve-group = "default" }

[tasks.configure]
cmd = "cmake -G Ninja -B build -S . -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_TESTS:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_UNITTESTS:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_EXAMPLES:BOOL=ON -DYGGDRASIL_RAPIDJSON_SCHEMA_TESTS:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_ASAN:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_UBSAN:BOOL=ON -DYGGDRASIL_RAPIDJSON_SKIP_VALGRIND_TESTS:BOOL=ON -DYGGDRASIL_RAPIDJSON_CREATE_METASCHEMA_FULL:BOOL=ON"
description = "Configure CMake build"
default-environment = "build"
inputs = ["CMakeLists.txt", "test/CMakeLists.txt"]
outputs = ["build/CMakeFiles/"]

[tasks.build]
cmd = "cmake --build build --target={{ target }} -- -j {{ nproc }}"
args = [
    { arg = "target", default = "tests" },
    { arg = "nproc", default = "8" },
]
depends-on = ["configure"]
description = "Build tests and libraries"
default-environment = "build"
inputs = [
    "CMakeLists.txt", "include/*", "test/*",
    # "test/unittest/*.cpp",
    # "test/perftest/*.cpp",
]
outputs = ["build/bin/unittest", "build/bin/perftest"]

[tasks.unittest]
cmd = "cd build && ctest -R unittest --stop-on-failure"
depends-on = ["build"]
description = "Run unit tests"
default-environment = "build"

[tasks.perftest]
description = "Run performance tests"
cmd = "cd build && ctest -R perftest --stop-on-failure"
depends-on = ["build"]
default-environment = "build"

[tasks.test]
description = "Run the test suite"
cmd = "cd build && ctest"
depends-on = ["build"]
default-environment = "build"

[tasks.install]
description = "Install the package"
cmd = "cmake --install build --prefix {{ prefix }}"
args = [
    { arg = "prefix", default= "_install" }
]
depends-on = ["build"]

[tasks.docs]
description = "Build the documentation with Doxygen"
cmd = "cmake -G Ninja -B build-doc -S . -DYGGDRASIL_RAPIDJSON_BUILD_DOC:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_TESTS:BOOL=OFF -DYGGDRASIL_RAPIDJSON_BUILD_EXAMPLES:BOOL=OFF && cmake --build build-doc --target doc"
default-environment = "docs"

[tasks.build-conda]
args = [
    { arg = "output_dir", default = "output" },
    { arg = "python_version", default = "3.11" },
]
cmd = "pixi publish --path conda.recipe/recipe.yaml --target-dir {{ output_dir }} --variant python={{ python_version }}"
description = "Build conda package with pixi publish into a local directory"
default-environment = "build-conda"
