[workspace]
name = "yggdrasil-rapidjson"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "*"
numpy = "*"

[feature.build.dependencies]
cmake = ">=3.18"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"
pkg-config = "*"

[feature.test.dependencies]
cmake = ">=3.18"
ninja = "*"
c-compiler = "*"
cxx-compiler = "*"
python = "*"
numpy = "*"

[feature.conda-build.dependencies]
conda-build = "*"
boa = "*"
rattler-build = "*"

[environments]
build = { features = ["build"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
conda-env = { features = ["conda-build"], solve-group = "default" }
default = { features = ["build"], solve-group = "default" }

[tasks.configure]
cmd = "cmake -G Ninja -B build -S . -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_TESTS:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_UNITTESTS:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_EXAMPLES:BOOL=ON -DYGGDRASIL_RAPIDJSON_SCHEMA_TESTS:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_ASAN:BOOL=ON -DYGGDRASIL_RAPIDJSON_BUILD_UBSAN:BOOL=ON -DYGGDRASIL_RAPIDJSON_SKIP_VALGRIND_TESTS:BOOL=ON -DYGGDRASIL_RAPIDJSON_CREATE_METASCHEMA_FULL:BOOL=ON"
description = "Configure CMake build"
default-environment = "build"

[tasks.build]
cmd = "cmake --build build --target=tests -- -j 8"
depends-on = ["configure"]
description = "Build tests and libraries"
default-environment = "build"

[tasks.test]
cmd = "cd build && ctest -R unittest --stop-on-failure"
depends-on = ["build"]
description = "Run unit tests"
default-environment = "test"

[tasks.install]
cmd = "cmake --install build --prefix _install"
depends-on = ["build"]
description = "Install the package"

[tasks.run-tests]
cmd = "./run_tests.sh"
description = "Run full test script"

[tasks.conda-build]
cmd = "rattler-build build --recipe conda.recipe/recipe.yaml"
description = "Build conda package with rattler-build"
default-environment = "conda-env"

[tasks.conda-build-legacy]
cmd = "conda-build conda.recipe"
description = "Build conda package with conda-build"
