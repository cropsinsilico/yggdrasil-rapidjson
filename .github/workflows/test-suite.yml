name: Test of package installation & execution
'on':
  push:
    branches-ignore:
      - gh-pages
  schedule:
    - cron: 0 10 * * 1
    - cron: 0 10 1 * *
  workflow_dispatch:

jobs:
  build_pip:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-install: [pip]
        python-version: ["3.11"]
        configuration: [Debug]
      fail-fast: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-tags: true
      - name: Install dependencies on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dbg gdb valgrind
          sudo apt upgrade --fix-missing
          valgrind --version
          # sudo apt autoremove -y
          # sudo apt autoclean -y
      - name: Install dependencies on MacOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install doxygen
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python environment variables
        shell: bash -l {0}
        run: |
          echo "pythonLocation=${pythonLocation}"
          echo "Python3_ROOT_DIR=${Python3_ROOT_DIR}"
      - name: Fix Python path on mac
        if: matrix.os == 'macos-latest'
        run: |
          tee -a ~/.profile <<<'export PATH="${pythonLocation}/bin:${PATH}"'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check for numpy
        run: |
          python -c "import sys; print(sys.executable)"
          python -c "import numpy; print(numpy.get_include())"
      - name: (WINDOWS) Configure w/ yggdrasil
        if: matrix.os == 'windows-latest'
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DPython3_ROOT_DIR=$env:pythonLocation -DYGGDRASIL_RAPIDJSON_SCHEMA_TESTS=ON -DYGGDRASIL_RAPIDJSON_BUILD_THIRDPARTY_GTEST=ON
      - name: (UNIX) Configure w/ yggdrasil
        if: matrix.os != 'windows-latest'
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DPython3_ROOT_DIR=${pythonLocation} -DYGGDRASIL_RAPIDJSON_SCHEMA_TESTS=ON -DYGGDRASIL_RAPIDJSON_BUILD_THIRDPARTY_GTEST=ON
      - name: Build
        run: |
          cd build
          cmake --build . --config ${{ matrix.configuration }}
      - name: Test
        run: |
          cd build
          ctest -C ${{ matrix.configuration }} --output-on-failure --verbose

  test:
    name: Run tests on ${{ matrix.os }} for Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        pixi-environment: [py311]
    steps:
      - uses: actions/checkout@v6
      - name: Set up MSVC Compiler on windows
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
        with:
          toolset: "14.44.35208"  # vs2022 set in conda-forge-pinnings
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: test-${{ matrix.pixi-environment }}
      - name: Run tests
        run: pixi run -e test-${{ matrix.pixi-environment }} all-tests -- --output-on-failure --verbose

  test-coverage:
    name: Run tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: test
      - name: Run tests
        run: pixi run -e test all-tests Debug -DYGGDRASIL_RAPIDJSON_ENABLE_COVERAGE=ON -- --output-on-failure --verbose
      - name: Upload coverage report
        uses: codecov/codecov-action@v1
        with:
          name: ubuntu-latest-py315  # ${{ matrix.os }}-${{ matrix.pixi-environment }}
          token: ${{ secrets.CODECOV_TOKEN }}
          file: build/coverage/coverage.info
          # directory: build/Testing/CoverageInfo
          functionalities: gcov

  test-release:
    name: Run tests on Release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: test
      - name: Run tests
        run: pixi run -e test all-tests Release -- --output-on-failure --verbose

  test-pure-rapidjson:
    name: Run tests with Yggdrasil extensions disabled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: test
      - name: Run tests
        run: pixi run -e test test unittest Debug -DDISABLE_YGGDRASIL_RAPIDJSON=ON -- --output-on-failure --verbose

  docs:
    name: Build the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
      - name: Build docs
        run: pixi run -e docs docs

  all_tests_passed:
    runs-on: ubuntu-latest
    name: All tests passed
    needs: [build_pip, test, test-coverage, test-release, test-pure-rapidjson, docs]
    if: always()
    steps:
      - name: All tests ok
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
